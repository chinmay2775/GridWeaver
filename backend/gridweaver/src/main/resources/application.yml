spring:
  application:
    name: gridweaver
  threads:
    virtual:
      enabled: true          # Tomcat request threads become virtual threads
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gridweaver: DEBUG

gridweaver:
  kafka:
    bootstrap-servers: localhost:9092
    topic: grid.telemetry     # 5 partitions, keyed by zone (Week 3)
