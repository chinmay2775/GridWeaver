spring:
  application:
    name: gridweaver
  threads:
    virtual:
      enabled: true          # Tomcat request threads become virtual threads
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gridweaver: DEBUG

gridweaver:
  zone:
    stressed-enter: 0.80
    stressed-exit: 0.70
    surplus-enter: 0.40
    surplus-exit: 0.50
    reserve-floor: 0.15
    reserve-restore: 0.25
  ingest:
    port: 9099
    backlog: 8192
    acceptors: 4
  kafka:
    bootstrap-servers: localhost:9092
    topic: grid.telemetry
  rules:
    tick-ms: 250
    discharge-above-load: 0.80
    charge-below-load: 0.40
    soc-floor: 0.20
    soc-ceiling: 0.95
    idle-band-kw: 0.10
    stale-after-ms: 5000