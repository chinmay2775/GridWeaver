spring:
  application:
    name: gridweaver
  threads:
    virtual:
      enabled: true          # Tomcat request threads become virtual threads
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.GridWeaver: DEBUG
    org.apache.kafka.common.config.AbstractConfig: WARN
    org.apache.kafka.clients.Metadata: WARN
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: WARN
    org.apache.kafka.common.telemetry.internals.KafkaMetricsCollector: WARN
    org.springframework.kafka.support.LoggingProducerListener: OFF

gridweaver:
  zone:
    stressed-enter: 0.80
    stressed-exit: 0.70
    surplus-enter: 0.40
    surplus-exit: 0.50
    reserve-floor: 0.15
    reserve-restore: 0.25
  ingest:
    mode: virtual
    port: 9099
    backlog: 8192
    acceptors: 4
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    topic: grid.telemetry
    publish-every-n-ticks: 4
    group-id: gridweaver-history
    concurrency: 5
    lag-poll-ms: 5000
    lag-warn-threshold: 500
  history:
      samples-per-zone: 600
  rules:
    tick-ms: 250
    discharge-above-load: 0.80
    charge-below-load: 0.40
    soc-floor: 0.20
    soc-ceiling: 0.95
    idle-band-kw: 0.10
    stale-after-ms: 5000
  eventlog:
    capacity: 4096
  balance:
    interconnect-kw: 2500
    reserve-margin: 0.10
    soc-ceiling: 0.95
    soc-floor: 0.20
    stale-after-ms: 5000
    min-transfer-kw: 50      # below this the transfer is not worth scheduling
    max-hops: 4